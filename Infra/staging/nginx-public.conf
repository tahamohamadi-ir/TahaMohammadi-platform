# Edge deny manifest map: maps revoked canonical paths to 404 at edge (§I06)
map $uri $edge_denied {
  default 0;
  include /etc/nginx/conf.d/edge-deny*.map;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  if ($edge_denied) {
    return 404;
  }

  location / { try_files $uri $uri/ =404; }
}
